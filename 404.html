<style>
@font-face{font-family:'Nunito';font-weight:200 1000;font-display:swap;src:url(/vyne-website/fonts/nunito-latin.woff2) format('woff2')}
:root{--bg:#F8F6F0; --ink:#2C2A26; --slate:#6C6860; --green:#6E9468; --btn:#4A6E45; --btn-ink:#fff}
@media (prefers-color-scheme:dark){ :root{ color-scheme:dark; --bg:#1E1C18; --ink:#F0EDE8; --slate:#A19E9A; --green:#A6CB9E; --btn:#A6CB9E; --btn-ink:#16200F } }
body{margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif; font-weight:600; padding-inline:20px; text-align:center}
main{display:grid; gap:14px; justify-items:center}
h1{font-weight:900; letter-spacing:-.02em; margin:0; font-size:clamp(28px,5vw,44px)}
p{margin:0; color:var(--slate)}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px}
a{background:var(--btn); color:var(--btn-ink); text-decoration:none; font-weight:800; padding:11px 20px; border-radius:999px}
a.alt{background:transparent; color:var(--ink); border:1.5px solid var(--slate)}
</style>
</head>

</main>
</body>
</html>
